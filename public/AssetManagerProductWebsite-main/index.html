imited Custom Categories tailored to AV equipment, decor, tools, or specialty supplies with their own condition notes and return rules."},{q:"How fast can we bring our existing inventory into the system?",a:"You can import existing stock lists in bulk from spreadsheets, add items one by one with photos, or use the mobile Bulk Scan mode to tag and register dozens of items during a single storeroom walkthrough."}]},{category:"Roles, Security & Approvals",questions:[{q:"What are the three user tiers in Asset Guard?",a:"Tier 1 Organization Admins manage all venues, licenses, value thresholds, and company-wide reports. Tier 2 Venue Admins receive transfers, manage stock inside their property, and allocate items to local teams. Tier 3 Department Operators run fast day-to-day checkouts, returns, photos, and signature captures on mobile."},{q:"How do high-value item approvals work?",a:"When a staff member requests or transfers equipment valued at $1,000 or more (or your chosen organization limit), Asset Guard automatically pauses the handover and alerts an Admin for review and approval before release."},{q:"How do team members sign in across web and mobile?",a:"Employees log in with their secure organization credentials and role-assigned access. Administrators can enforce two-step authentication and session timeouts to keep operational data protected across shared shift devices."}]},{category:"Field Scanning, Transfers & Offline Mode",questions:[{q:"Can our staff keep scanning in basement vaults or venues without Wi-Fi?",a:"Yes. Asset Guard caches your assigned venue inventory ahead of shifts so staff can continue scanning barcodes, saving condition photos, collecting digital signatures, and logging returns completely offline. Everything syncs automatically the moment a connection returns."},{q:"What happens if two offline workers accidentally update the same item?",a:"When queued offline updates reach the system, Asset Guard protects the official live timeline so duplicate or conflicting checkouts cannot silently overwrite custody records, and flags the conflict clearly for a manager to review."},{q:"How do HQ-to-Venue transfers prevent items from disappearing in transit?",a:"Dispatching items from central storage creates an official manifest and marks them as In Transit. Receiving venue managers cannot clear the transfer until they scan every tag on arrival—flagging any missing or damaged items right away."}]},{category:"Reporting & Organization Licensing",questions:[{q:"What audit reports and proof can managers export?",a:"Managers can export polished PDF handover receipts complete with timestamps, custodian details, condition photos, and signatures, as well as CSV and PDF summaries for shift audits, overdue items, damaged quarantine logs, and cross-venue stock balances."},{q:"What happens when our organization license is about to expire?",a:"Organization Admins receive in-app notifications starting 7 days before the license end date so renewals never slip through. If a license temporarily lapses, every historical log, photo, and record stays safely stored until renewed."}]}];function aE(){const[n,i]=T.useState("0-0"),l=r=>{i(n===r?null:r)};return d.jsx("div",{className:"bg-[#F0F5FB] min-h-screen pt-16 pb-24 px-4 sm:px-6 lg:px-8",children:d.jsxs("div",{className:"max-w-3xl mx-auto",children:[d.jsxs(Se.div,{initial:{opacity:0,y:18},animate:{opacity:1,y:0},className:"text-center mb-16",children:[d.jsx("div",{className:"flex justify-center mb-6",children:d.jsx("div",{className:"p-4 bg-white rounded-full text-indigo-600 shadow-sm border border-[#DDE5F0]",children:d.jsx(m5,{className:"w-10 h-10 text-cyan-500"})})}),d.jsx("h1",{className:"text-4xl md:text-5xl font-extrabold text-slate-900 mb-5",children:"Frequently Asked Questions"}),d.jsx("p",{className:"text-lg sm:text-xl text-slate-600 leading-relaxed",children:"Clear answers about multi-venue tracking, offline mode, staff roles, custody receipts, and organization licensing."})]}),d.j ng Venues & Departments","Importing Existing Inventory"]},"Creating Venues & Departments":{title:"Creating Venues & Departments",category:"Getting Started",intro:"Structure your Asset Guard workspace around your real properties, outlets, and frontline teams.",tipTitle:"Clean Role Boundaries",tipBody:"When each venue and department is set up cleanly, frontline staff only see the stock and checklists relevant to their own shift.",steps:[{heading:"1. Add Venues or Branch Sites",text:"From the Organization Admin dashboard, add each hotel, bar, event hall, or regional office inside your portfolio."},{heading:"2. Divide into Departments",text:"Under each venue, create departments such as Front Desk, Bell Desk, Housekeeping, Food & Beverage, AV Production, or IT Support.",bullets:["Assign a Tier 2 Venue Admin to oversee each property.","Invite Tier 3 Department Operators to run mobile handovers on the floor."]}],related:["Activating Your License","HQ-to-Venue Dispatches"]},"Importing Existing Inventory":{title:"Importing Existing Inventory",category:"Getting Started",intro:"Move out of spreadsheets quickly using bulk imports, manual item entry, or rapid mobile scanning.",tipTitle:"Label As You Go",tipBody:"Every imported asset receives a scannable tag record so teams can print QR labels or link existing barcode stickers.",steps:[{heading:"1. Prepare Your Item List",text:"Gather item names, categories (electronics, beverage stock, linens, luggage, or custom types), replacement values, and starting locations."},{heading:"2. Bulk Import or Walk & Scan",text:"Upload your spreadsheet through the web command center—or open Bulk Scan on mobile while walking through storage rooms to register multiple items consecutively."}],related:["Single & Bulk QR Scanning","Custom Asset Categories"]},"Single & Bulk QR Scanning":{title:"Single & Bulk QR Scanning",category:"Scanning & Handovers",intro:"Speed up checkouts, shift handovers, and stock counts with camera-based QR and barcode scanning.",tipTitle:"Works on Any Team Smartphone",tipBody:"No special hardware is mandatory—use standard iOS or Android phone cameras right out of the box.",steps:[{heading:"1. Single-Item Lookup",text:"Tap Scan on the mobile home bar to open the camera. Point at an asset tag to view status, current custodian, condition notes, and full movement history."},{heading:"2. Bulk Scan Mode",text:"Switch on Bulk Scan Mode when receiving deliveries, issuing banquet equipment batches, or counting bar bottles and towel bins—confirming dozens of items in one flow."}],related:["Staff & Guest Folio Checkouts","Using Offline Mode"]},"Staff & Guest Folio Checkouts":{title:"Staff & Guest Folio Checkouts",category:"Scanning & Handovers",intro:"Tie every checked-out asset directly to a staff badge or guest room reservation.",tipTitle:"Duplicate Prevention",tipBody:"Items already marked In Use or Quarantined cannot be checked out again until properly returned or cleared.",steps:[{heading:"1. Assigning to Staff",text:"Scan the item tag, select the receiving team member by name or employee ID, confirm return due timing, and save the handover."},{heading:"2. Linking to a Guest Folio or Room",text:"For loaned electronics, stored bell-desk bags, or specialty room items, link the checkout straight to a guest room number or reservation reference."}],related:["Condition Photos & Signatures","Return Audits & Quarantine"]},"Condition Photos & Signatures":{title:"Condition Photos & Signatures",category:"Scanning & Handovers",intro:"Back up every high-value checkout, transfer, and return with clear visual and signed evidence.",tipTitle:"Mandatory Proof Rules",tipBody:"Category rules can automatically require condition photos and an on-screen signature before a transaction can be completed.",steps:[{heading:"1. Before & After Condition Photos",text:"Capture close-up photos of electronics screens, bottle seals, towel bundles, or luggage exteriors both when issuing and when receiving items back."},{heading:"2. On-Screen Digital Signatures",text:"Collect a finger signature from the receiving staff member, manager, or guest. Every signature and photo attaches permanently to the item PDF receipt."}],related:["Staff & Guest Folio Checkouts","Exporting PDF & CSV Audits"]},"HQ-to-Venue Dispatches":{title:"HQ-to-Venue Dispatches",category:"Transfers & Returns",intro:"Move inventory confidently between central HQ storage vaults and branch venues without transit blind spots.",tipTitle:"Enforced In-Transit Status",tipBody:"Dispatched items are locked under an official transfer manifest until the receiving venue confirms arrival.",steps:[{heading:"1. Build a Transfer Manifest",text:"Select items or scan crates in HQ storage, choose the destination venue and department, and confirm dispatch. Every listed item changes to In Transit."},{heading:"2. High-Value Protection",text:"If transferred items cross your high-value approval limit, an Organization Admin approves the release before dispatch leaves storage."}],related:["Arrival Re-Scan Verification","High-Value Approval Rules"]},"Arrival Re-Scan Verification":{title:"Arrival Re-Scan Verification",category:"Transfers & Returns",intro:"Ensure every single dispatched item reaches the destination venue intact.",tipTitle:"Spot Discrepancies Immediately",tipBody:"Receiving teams cannot silently mark an entire truckload complete—each barcode must be accounted for.",steps:[{heading:"1. Open Incoming Transfer",text:"Venue Admins receive an alert showing incoming transfers from central HQ storage along with the expected item count."},{heading:"2. Re-Scan Every Item Upon Arrival",text:"Scan tags one by one or in Bulk mode. Matched items switch immediately to Available at the destination venue, while missing items are flagged right away."}],related:["HQ-to-Venue Dispatches","Return Audits & Quarantine"]},"Return Audits & Quarantine":{title:"Return Audits & Quarantine",category:"Transfers & Returns",intro:"Keep broken or damaged gear out of g
